<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found | Dr_Animalis.DEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<main class="error-page">
  <div class="error-frame">
    <div class="terminal-bar">
      <span class="terminal-dot r"></span>
      <span class="terminal-dot y"></span>
      <span class="terminal-dot g"></span>
      <span class="terminal-title">dr_animalis — not-found</span>
    </div>
    <div class="error-body">
      <div class="error-code">404</div>
      <div class="error-label">PAGE_NOT_FOUND</div>

      <div class="error-terminal" id="errorTerminal" aria-live="polite"></div>

      <div class="error-cta">
        <a href="/" class="btn btn-primary">← RETURN HOME</a>
      </div>
    </div>
  </div>
</main>

<script src="js/script.js"></script>
</body>
</html>
